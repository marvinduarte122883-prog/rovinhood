<div class="page">

<!-- LOGIN -->
    <section class="login-side">

        <div class="login-box">

            <div class="small-title">
                Duarte Clan Community
            </div>

            <h2>Welcome Back</h2>

            <p class="welcome">
                Sign in to continue to your Duarte Clan community.
            </p>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="forgot">

                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    LOGIN
                </button>

            </form>


            <div class="divider">
                OR
            </div>


            <div class="create">

                Don't have an account?

                <a href="#" id="createAccount">
                    Create Account

            </div>


            <div class="footer">
                © 2026 DUARTE CLAN • PRIVATE FAMILY COMMUNITY

</div>

const message =
    document.getElementById("message");

const passwordInput =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message show " + type;

}


/* PASSWORD VISIBILITY */

togglePassword.addEventListener("click", function () {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";
        togglePassword.textContent = "🙈";

    } else {

        passwordInput.type = "password";
        togglePassword.textContent = "👁";

    }

});


/* LOGIN */

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        passwordInput.value;

    if (!email || !password) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }


    loginButton.disabled = true;
    loginButton.textContent = "SIGNING IN...";

    message.className = "message";


    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if (error) {
            throw error;
        }


        if (!data.session) {

            throw new Error(
                "Login succeeded but no session was created."
            );

        }


        showMessage(
            "Login successful. Opening Duarte Clan...",
            "success"
        );


        setTimeout(function() {

            window.location.href = "index.html";

        }, 700);


    } catch(error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to sign in. Please check your account.",
            "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "LOGIN";

    }

});


/* CREATE ACCOUNT */

document
.getElementById("createAccount")
.addEventListener("click", async function(event) {

    event.preventDefault();

    const email =
        prompt("Enter your email address:");

    if (!email) return;


    const password =
        prompt("Create a password (minimum 6 characters):");

    if (!password) return;


    if (password.length < 6) {

        showMessage(
            "Password must contain at least 6 characters.",
            "error"
        );

        return;

    }


    const fullName =
        prompt("Enter your full name:");

    if (!fullName) return;


    try {

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,
                password: password,

                options: {
                    data: {
                        full_name: fullName
                    }
                }

            });


        if (error) {
            throw error;
        }


        showMessage(
            "Account created. Check your email if email confirmation is enabled.",
            "success"
        );


    } catch(error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to create your account.",
            "error"
        );

    }

});


/* FORGOT PASSWORD */

document
.getElementById("forgotPassword")
.addEventListener("click", async function(event) {

    event.preventDefault();

    const email =
        prompt("Enter your Duarte Clan account email:");

    if (!email) return;


    try {

        const { error } =
            await supabaseClient.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin +
                        "/reset-password.html"
                }
            );


        if (error) {
            throw error;
        }


        showMessage(
            "Password reset instructions have been sent to your email.",
            "success"
        );


    } catch(error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to send password reset email.",
            "error"
        );

    }

});


/* IF ALREADY LOGGED IN */

(async function checkExistingSession() {

    const { data } =
        await supabaseClient.auth.getSession();

    if (data.session) {

        console.log(
            "Existing Duarte Clan session detected."
        );

        // already-logged-in users to go directly home.

        // window.location.href = "index.html";

    }

})();

<script id="duarte-login-dialog-fix-js">
(function(){
 const modal=document.getElementById("dcAuthModal"), form=document.getElementById("dcAuthForm"),
 title=document.getElementById("dcAuthTitle"), help=document.getElementById("dcAuthHelp"),
 nameRow=document.getElementById("dcNameRow"), passRow=document.getElementById("dcPasswordRow"),
 name=document.getElementById("dcAuthName"), email=document.getElementById("dcAuthEmail"),
 pass=document.getElementById("dcAuthPassword"), err=document.getElementById("dcAuthError");
 let mode="signup";
 function close(){modal.classList.remove("open");modal.setAttribute("aria-hidden","true");form.reset();err.textContent=""}
 function open(m){
   mode=m; form.reset(); err.textContent="";
   const signup=m==="signup";
   title.textContent=signup?"Create Duarte Clan Account":"Reset Password";
   help.textContent=signup?"Enter your details below. Your clan account may still require approval.":"Enter your Duarte Clan account email and we’ll send the reset link.";
   nameRow.style.display=signup?"block":"none"; passRow.style.display=signup?"block":"none";
   name.required=signup; pass.required=signup;
   modal.classList.add("open");modal.setAttribute("aria-hidden","false");setTimeout(()=>email.focus(),50);
 }
 function replaceLink(id,handler){
   const old=document.getElementById(id); if(!old)return;
   const fresh=old.cloneNode(true); old.replaceWith(fresh);
   fresh.addEventListener("click",e=>{e.preventDefault();handler()});
 }
 replaceLink("createAccount",()=>open("signup"));
 replaceLink("forgotPassword",()=>open("reset"));
 modal.querySelector(".dc-auth-cancel").onclick=close;
 modal.addEventListener("click",e=>{if(e.target===modal)close()});
 form.addEventListener("submit",async e=>{
   e.preventDefault();err.textContent="";
   const em=email.value.trim();
   try{
     if(mode==="signup"){
       if(!name.value.trim()){err.textContent="Enter your full name.";return}
       if(pass.value.length<6){err.textContent="Password must contain at least 6 characters.";return}
       const {error}=await supabaseClient.auth.signUp({email:em,password:pass.value,options:{data:{full_name:name.value.trim()}}});
       if(error)throw error;
       close(); if(typeof showMessage==="function")showMessage("Account created. Please check your email or wait for clan approval.","success");
     }else{
       const {error}=await supabaseClient.auth.resetPasswordForEmail(em,{redirectTo:location.origin+"/reset-password.html"});
       if(error)throw error;
       close(); if(typeof showMessage==="function")showMessage("Password reset link sent. Please check your email.","success");
     }
   }catch(ex){err.textContent=ex?.message||"Unable to complete this request."}
 });
})();
</script>
